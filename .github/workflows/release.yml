name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 26
      - run: vp run build
      - run: npm stage publish
